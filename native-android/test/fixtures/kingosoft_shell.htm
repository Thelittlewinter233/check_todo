            var id=obj.value;
            if(obj.checked){
                var val=window.frames["frmReport"].document.getElementById(id+"_kcdm").innerHTML;
                xhsmap.put(id,val);
            }else{
                xhsmap.remove(id,val);
            }
            var resultArray=xhsmap.values();
            var results="";
            for(var i=0;i<xhsmap.size();i++){
                if(i==0){
                    results+=resultArray[i];
                }
                else{
                    results+=","+resultArray[i];
                }

            return xhs;
            //xhs.push("aa",window.frames["frmReport"].document.getElementById(id+"_xtxh").innerHTML);

                if(kjs[i].type=="checkbox"&&kjs[i].checked){

                    var _document=document.getElementById(frm).contentWindow.document;

                    }else{
                        results+=fgf+_document.getElementById(id+name).innerHTML;
                    }
                }
            }
            if(""!=Trim(results)){
                return results;
            }else{
                return "";
            }
